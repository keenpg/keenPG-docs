site_name: keenPGO Documentation
site_description: Keen for Postgres
site_url: https://keenpgodocs.keenpg.in/
repo_url: https://github.com/keenpg/keenPG-docs
repo_name: keenpg/keenPG-docs
edit_uri: edit/main/docs/
copyright: © 2026 keenPG.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true     
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg      

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Features: features.md
  - Architecture:
       - "HA architecture": architecture/ha.md
       - "Backup and Restore": architecture/backupandrestore.md
       - "DR detailed architecture": architecture/dr.md
       - "Monitoring stack": architecture/monitoring.md
       - "Console": architecture/console.md
  - Installation:
       - Installation/index.md
       - "Installation on Minikube": Installation/minikube.md
       - "Installation on Kubernetes": Installation/kubernetes.md
       - "Installation on OpenShift": Installation/openshift.md
       - "Installation via Helm charts": Installation/helm.md    
       - "Installation in Disconnected Environment": Installation/disconnected.md
  - Guide to Console: console.md
  - DB Cluster:
      - "Detail DB Instance": db/detail.md
      - "Postgres Parameter": db/parameter.md
      - "User Management": db/user.md
      - "pg_hba Management": db/pghba.md
  - Backup and restore: backups.md
  - Security: security.md
  - Support: support.md
  - Troubleshooting: troubleshooting.md
