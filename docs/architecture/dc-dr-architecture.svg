<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Disaster recovery architecture with DC and DR Kubernetes clusters and object storage" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <defs><style>
:root{--surface:#fff;--ink:#1b2230;--muted:#5f6b7e;--line:#6d788b;--accent:#e0561f;--dc:#2f6fdb;--dc-bg:#eaf1fd;--dr:#1f9d78;--dr-bg:#e6f6f0}
@media (prefers-color-scheme:dark){:root{--surface:#1b2029;--ink:#e8ecf3;--muted:#9aa5b8;--line:#8d97a8;--dc:#6b9cf5;--dc-bg:#1a2437;--dr:#4cc9a1;--dr-bg:#15291f}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.zone{stroke-width:1.5;stroke-dasharray:6 5}.zone.dc{fill:var(--dc-bg);stroke:var(--dc)}.zone.dr{fill:var(--dr-bg);stroke:var(--dr)}
.ztitle{font-weight:700;font-size:15px;fill:var(--ink)}.zsub{font-size:12.5px;fill:var(--muted);text-anchor:middle}
.pill{fill:var(--surface);stroke:var(--line)}.pilltxt{font-weight:700;font-size:15px;fill:var(--ink);text-anchor:middle}
.node .shape{fill:var(--surface);stroke-width:2}.node.dc .shape{stroke:var(--dc)}.node.dr .shape{stroke:var(--dr)}
.node text{fill:var(--ink);font-size:13px;font-weight:600;text-anchor:middle}
.edgeg .v{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#ah)}.edgeg.bi .v{marker-start:url(#ah)}
.elabel{font-size:12.5px;fill:var(--muted)}
</style>
          <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker>
          <marker id="ah-on" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker>
        </defs>
        

        <rect class="pill" x="320" y="10" width="160" height="34" rx="17"/>
        <text class="pilltxt" x="400" y="32">Initial Setup</text>

        <text class="ztitle" x="20" y="80">DC Environment</text>
        <rect class="zone dc" x="20" y="90" width="320" height="300" rx="6"/>
        <text class="zsub" x="180" y="114">Kubernetes cluster in DC</text>

        <text class="ztitle" x="460" y="80">DR Environment</text>
        <rect class="zone dr" x="460" y="90" width="320" height="300" rx="6"/>
        <text class="zsub" x="620" y="114">Kubernetes cluster in DR</text>

        <!-- edges -->
        <g class="edgeg" data-id="e1"><path class="v" d="M160 175H200V480"/></g>
        <g class="edgeg bi" data-id="e2"><path class="v" d="M160 480V440H105V362"/></g>
        <g class="edgeg bi" data-id="e3"><path class="v" d="M215 525H585"/></g>
        <g class="edgeg bi" data-id="e4"><path class="v" d="M595 480V222"/></g>
        <g class="edgeg bi" data-id="e5"><path class="v" d="M645 480V362"/></g>

        <text class="elabel" data-edge="e1" x="210" y="425">Pushing WAL file</text>
        <text class="elabel" data-edge="e1" x="210" y="442">to object storage</text>
        <text class="elabel" data-edge="e2" x="97" y="410" text-anchor="end">Recovery from DC</text>
        <text class="elabel" data-edge="e2" x="97" y="427" text-anchor="end">object storage</text>
        <text class="elabel" data-edge="e3" x="400" y="513" text-anchor="middle">Replication between DC and DR object storage</text>
        <text class="elabel" data-edge="e4" x="662" y="425">Recovery from DR</text>
        <text class="elabel" data-edge="e4" x="662" y="442">object storage</text>

        <!-- nodes -->
        <g class="node dc" data-id="dcMain"><rect class="shape" x="50" y="140" width="110" height="70" rx="8"/><text x="105" y="171">DC Main</text><text x="105" y="189">Cluster</text></g>
        <g class="node dc" data-id="dcStandby"><rect class="shape" x="50" y="290" width="110" height="70" rx="8"/><text x="105" y="321">DC Standby</text><text x="105" y="339">Cluster</text></g>
        <g class="node dr" data-id="drMain"><rect class="shape" x="500" y="150" width="110" height="70" rx="8"/><text x="555" y="181">DR Main</text><text x="555" y="199">Cluster</text></g>
        <g class="node dr" data-id="drStandby"><rect class="shape" x="630" y="290" width="110" height="70" rx="8"/><text x="685" y="321">DR Standby</text><text x="685" y="339">Cluster</text></g>

        <g class="node dc" data-id="dcStore">
          <path class="shape" d="M145 480a35 10 0 0 1 70 0v70a35 10 0 0 1 -70 0z"/><path class="shape" style="fill:none" d="M145 480a35 10 0 0 0 70 0"/>
          <text x="180" y="582">DC Object Storage</text></g>
        <g class="node dr" data-id="drStore">
          <path class="shape" d="M585 480a35 10 0 0 1 70 0v70a35 10 0 0 1 -70 0z"/><path class="shape" style="fill:none" d="M585 480a35 10 0 0 0 70 0"/>
          <text x="620" y="582">DR Object Storage</text></g>
      </svg>